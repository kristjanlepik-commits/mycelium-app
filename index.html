<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F4F4">
<title>Mycelium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">
<style>
  :root {
    --ground:#F1F4F4; --surface:#FFF; --surface-2:#F7F9F9;
    --ink:#141C1B; --ink-2:#55635F; --ink-3:#849490;
    --line:#DCE3E2; --line-soft:#E9EEED;
    --urgent:#C63F3F; --urgent-bg:#FBEBEB;
    --ma:#6D4C8C; --arb:#1F7A6B; --per:#A66A2E; --tls:#2E5C8A; --focus:#1F7A6B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#101413; --surface:#182120; --surface-2:#1E2827;
      --ink:#E4EBE9; --ink-2:#9BAAA6; --ink-3:#6D7C78;
      --line:#2A3634; --line-soft:#222D2C;
      --urgent:#F07A7A; --urgent-bg:#331D1D;
      --ma:#B79BD4; --arb:#4FC0AB; --per:#DCA45F; --tls:#7BA9D8; --focus:#4FC0AB;
    }
  }
  :root[data-theme="dark"] {
    --ground:#101413; --surface:#182120; --surface-2:#1E2827;
    --ink:#E4EBE9; --ink-2:#9BAAA6; --ink-3:#6D7C78;
    --line:#2A3634; --line-soft:#222D2C;
    --urgent:#F07A7A; --urgent-bg:#331D1D;
    --ma:#B79BD4; --arb:#4FC0AB; --per:#DCA45F; --tls:#7BA9D8; --focus:#4FC0AB;
  }
  *{box-sizing:border-box}
  html{overscroll-behavior-y:none}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 56px}

  header.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding-bottom:12px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .stamp{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-3);
    margin-left:auto;font-variant-numeric:tabular-nums}

  .group{margin-top:18px}
  .ghead{display:flex;align-items:center;gap:8px;padding:0 2px 6px;
    font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--gh)}
  .group[data-d="ma"]{--gh:var(--ma)} .group[data-d="arbonics"]{--gh:var(--arb)}
  .group[data-d="personal"]{--gh:var(--per)} .group[data-d="tls"]{--gh:var(--tls)}
  .gcount{margin-left:auto;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:400}

  ul{list-style:none;margin:0;padding:0;background:var(--surface);
    border:1px solid var(--line);border-left:3px solid var(--gh);border-radius:3px;overflow:hidden}
  li{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;
    border-bottom:1px solid var(--line-soft)}
  li:last-child{border-bottom:0}
  li[data-prio="high"]{background:linear-gradient(90deg,var(--urgent-bg),transparent 60%)}

  button.tick{appearance:none;flex:none;width:26px;height:26px;margin-top:1px;
    border:1.5px solid var(--ink-3);border-radius:4px;background:var(--surface);cursor:pointer;
    position:relative;transition:none}
  button.tick:active{transform:scale(.92)}
  button.tick[aria-pressed="true"]{background:var(--focus);border-color:var(--focus)}
  button.tick[aria-pressed="true"]::after{content:"";position:absolute;left:8px;top:3px;
    width:6px;height:12px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
  li.busy button.tick{opacity:.4}
  li.sent{opacity:.5}
  .body{min-width:0;flex:1}
  .t{font-size:15.5px;word-wrap:break-word}
  li.sent .t{text-decoration:line-through}
  .meta{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-3);
    margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .due.soon{color:var(--urgent);font-weight:500}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;
    padding:18px;margin-top:18px}
  .panel h2{margin:0 0 8px;font-size:15px}
  .panel p{margin:0 0 12px;color:var(--ink-2);font-size:14px}
  input[type=password],input[type=text]{width:100%;padding:11px 12px;font-size:16px;
    font-family:"IBM Plex Mono",monospace;background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line);border-radius:3px}
  button.primary{margin-top:10px;width:100%;padding:12px;font-size:15px;font-weight:600;
    background:var(--focus);color:var(--surface);border:0;border-radius:3px;cursor:pointer}
  button.link{background:none;border:0;color:var(--ink-3);font-size:12px;cursor:pointer;
    text-decoration:underline;padding:0;font-family:inherit}

  .msg{margin-top:14px;padding:11px 13px;border-radius:3px;font-size:14px}
  .msg.err{background:var(--urgent-bg);color:var(--urgent);border:1px solid var(--urgent)}
  .msg.ok{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .empty{padding:14px;color:var(--ink-3);font-style:italic;font-size:14px}

  .addbtn{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;
    padding:4px 10px;border-radius:999px;border:1px dashed var(--line);
    background:transparent;color:var(--ink-3);cursor:pointer}
  .addbtn:active{border-style:solid;border-color:var(--gh);color:var(--gh)}
  li.adding{background:var(--surface-2)}
  li.adding input{flex:1;min-width:0;padding:8px 10px;font-size:16px;
    font-family:inherit;background:var(--surface);color:var(--ink);
    border:1px solid var(--focus);border-radius:3px}
  li.adding .go{flex:none;padding:8px 14px;font-size:14px;font-weight:600;
    background:var(--focus);color:var(--surface);border:0;border-radius:3px;cursor:pointer}
  .meta input[type=date]{width:auto;padding:4px 6px;font-size:14px;font-family:inherit}
  .meta .go{padding:4px 10px;font-size:13px;font-weight:600;background:var(--focus);
    color:var(--surface);border:0;border-radius:3px;cursor:pointer}
  li.pending{opacity:.6}
  li.pending .tid{font-style:italic}
  footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  /* pull to refresh */
  #pull{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-end;
    justify-content:center;pointer-events:none;overflow:hidden;height:0;
    color:var(--ink-3);font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;z-index:9}
  #pull span{padding-bottom:8px}
  body.pulling{overscroll-behavior-y:contain}

  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="pull" aria-hidden="true"><span id="pulltext"></span></div>
  <header class="top">
    <h1>Mycelium</h1>
    <span class="stamp" id="stamp"></span>
  </header>
  <div id="main"></div>
  <footer>
    <span id="foot"></span>
    <button class="link" id="reload">refresh</button>
    <button class="link" id="forget">forget token</button>
  </footer>
</div>

<script>
/* Mycelium capture app.
 *
 * Writes straight to the repository. There is no server and no second copy:
 * a tick becomes one new file in inbox/, and an agent session folds it into
 * ledger.jsonl. The board it replaces could not write anywhere, which is why
 * it needed a drain, staleness checks and a browser mirror. None of that
 * exists here.
 *
 * WHY ONE FILE PER EVENT. Updating a file through the GitHub API requires its
 * current blob SHA and returns 409 if someone changed it first. Creating a path
 * that has never existed needs no SHA and cannot conflict. So this never touches
 * the log — it only ever adds a file nobody else will write. The conflict class
 * is designed out rather than handled.
 *
 * WHAT IS STORED IN THE BROWSER. The token, and nothing else. No task, no tick,
 * no note is ever held here: a tap either reaches the repository or reports that
 * it did not. Work living only on the device that recorded it is what lost four
 * completions on 27 August.
 */
const REPO = "kristjanlepik-commits/mycelium-core";
const API  = "https://api.github.com/repos/" + REPO + "/contents/";
const TZ   = "Europe/Tallinn";
const KEY  = "mycelium-token";
const BUILD = "2026-08-28h";   // shown in the footer, so a cached copy is obvious
const DOMAINS = ["arbonics", "ma", "tls", "personal"];
const LABEL = {arbonics:"Arbonics", ma:"Arbonics M&A", tls:"The Long Swell", personal:"Personal"};

const $ = s => document.querySelector(s);
let token = null, tasks = [];

/* ---- github ---- */

async function get(path) {
  const r = await fetch(API + path + "?ref=main", {
    headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"},
    cache: "no-store"
  });
  // A 404 here is NOT "no tasks". GitHub returns 404 rather than 403 when a
  // fine-grained token lacks access to a repository, so a token missing the
  // Contents permission produced a page reading "Nothing open — every task is
  // closed". A reassuring empty result standing in for a failed read is the
  // exact bug this system keeps having; it must be loud.
  if (r.status === 404) {
    // Work out WHICH 404 this is instead of making him guess. GitHub hides a
    // private repo behind 404 rather than 403, so "token is wrong", "token
    // cannot see this repo" and "file is missing" all look identical here.
    // Two extra calls turn that into an answer on screen.
    throw new Error(await diagnose(path));
  }
  if (r.status === 401) throw new Error("Token rejected. Generate a new one.");
  if (!r.ok) throw new Error("GitHub " + r.status + " reading " + path);
  const j = await r.json();
  // atob yields one byte per char; decode as UTF-8 so accents survive.
  const bytes = Uint8Array.from(atob(j.content.replace(/\n/g, "")), c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

async function diagnose(path) {
  const h = {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"};
  let who = null, repo = null;
  try { const u = await fetch("https://api.github.com/user", {headers: h});
        who = u.ok ? (await u.json()).login : null; } catch (e) {}
  try { const p = await fetch("https://api.github.com/repos/" + REPO, {headers: h});
        repo = p.status; } catch (e) {}

  if (who === null)
    return "The token is not valid. Generate a new one and paste it again.";
  if (repo === 404)
    return "Signed in as " + who + ", but this token cannot see " + REPO + ".\n\n" +
           "On the token page, check BOTH:\n" +
           "• Repository access = Only select repositories, with mycelium-core ticked\n" +
           "• Permissions > Repository > Contents = Read and write\n\n" +
           "Both default to off, and either one alone gives exactly this.";
  if (repo && repo >= 400)
    return "Signed in as " + who + ", but reading " + REPO + " returned " + repo + ".";
  return "Signed in as " + who + " and " + REPO + " is reachable, but " + path +
         " is missing from it. That is a repository problem, not a token problem.";
}

async function put(path, text, message) {
  const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(text)));
  const r = await fetch(API + path, {
    method: "PUT",
    headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json",
              "Content-Type": "application/json"},
    body: JSON.stringify({message, content: b64, branch: "main"})
  });
  if (!r.ok) {
    let d = ""; try { d = (await r.json()).message || ""; } catch (e) {}
    throw new Error("Could not save (" + r.status + ") " + d);
  }
  return r.json();
}

/* ---- data ---- */

// Seven columns. Status is deliberately not among them: the index says what
// EXISTS, the ledger says what happened to it.
function parseIndex(text, domain) {
  const out = [];
  for (const line of (text || "").split("\n")) {
    const s = line.trim();
    if (!s || s.startsWith("#") || s.startsWith("ID |")) continue;
    const c = s.split("|").map(x => x.trim());
    if (c.length !== 7 || !c[0].startsWith("M-")) continue;
    out.push({id:c[0], domain, title:c[2], prio:c[4], due:c[5], link:c[6]});
  }
  return out;
}

// Replay the log. Last event by timestamp wins, exactly as ledger.py does it —
// so this page and the scripts can never disagree about what is open.
function derive(text) {
  const evs = [];
  for (const line of (text || "").split("\n")) {
    const s = line.trim();
    if (s) { try { evs.push(JSON.parse(s)); } catch (e) {} }
  }
  evs.sort((a, b) => (a.ts + a.id).localeCompare(b.ts + b.id));
  const st = {};
  for (const e of evs) {
    if (e.event === "done")      st[e.id] = "done";
    else if (e.event === "reopened") st[e.id] = "open";
    else if (e.event === "dropped")  st[e.id] = "dropped";
  }
  return st;
}

async function inbox() {
  /* Everything written but not yet folded.
   *
   * Without this the app renders only the index, so a task added a minute ago
   * vanishes on the next refresh and looks lost — it is sitting safely in the
   * repository, invisible. Showing work in flight is the difference between
   * "not counted yet" and "gone", and only one of those is true.
   */
  const r = await fetch(API + "inbox?ref=main", {
    headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"},
    cache: "no-store"
  });
  if (!r.ok) return [];                       // no inbox yet is normal, not an error
  const files = (await r.json()).filter(f => f.name.endsWith(".json"));
  const out = [];
  for (const f of files) {
    try {
      const c = await fetch(f.url, {headers: {Authorization: "Bearer " + token},
                                    cache: "no-store"});
      if (!c.ok) continue;
      const j = await c.json();
      const bytes = Uint8Array.from(atob(j.content.replace(/\n/g, "")), ch => ch.charCodeAt(0));
      out.push(JSON.parse(new TextDecoder().decode(bytes)));
    } catch (e) { /* one unreadable file must not hide the rest */ }
  }
  return out;
}

/* ---- keeping every open copy current ---------------------------------
 * The same page runs on the phone and on the Mac, and both read the same
 * repository, so they agree as long as they have both looked recently. A tab
 * left open all afternoon is showing the afternoon it was opened in, which is
 * how two surfaces come to disagree without either of them being wrong.
 *
 * So: reload when a tab comes back to the front, and quietly every two minutes
 * while it is being looked at. Refreshes are silent — no wipe to "Loading…" —
 * because a list that blinks every two minutes is worse than a stale one.
 */
let loading = false, lastLoad = 0;

async function load(quiet) {
  if (loading) return;                       // never two reads in flight
  loading = true;
  try {
    await read(quiet);
    lastLoad = Date.now();
  } finally {
    loading = false;
  }
}

async function read(quiet) {
  if (!quiet) $("#main").innerHTML = '<div class="panel"><p>Loading…</p></div>';
  const [ledger, pend, ...idx] = await Promise.all([
    get("ledger.jsonl"),
    inbox(),
    ...DOMAINS.map(d => get("index/" + d + ".md"))
  ]);
  const state = derive(ledger);
  tasks = [];
  let parsed = 0;
  DOMAINS.forEach((d, i) => {
    const rows = parseIndex(idx[i], d);
    parsed += rows.length;
    rows.forEach(t => { if ((state[t.id] || "open") === "open") tasks.push(t); });
  });

  // Read something, parsed nothing: the column format moved and every row was
  // skipped. Same guard as build.py, for the same reason — an empty result that
  // looks like good news is worse than an error. "Nothing open" must only ever
  // mean the work is genuinely done.
  const hadContent = idx.some(t => t && /\n\s*M-[A-Z]+-\d+\s*\|/.test(t));
  if (hadContent && parsed === 0) {
    throw new Error("The index has rows but none could be read — the column " +
      "format has changed. Refusing to show an empty list.");
  }

  // Apply what is in flight. A tick already written but not folded keeps its
  // task off the list; a task added but not folded appears as pending.
  const ticked = new Set(pend.filter(e => e.event === "done").map(e => e.id));
  tasks = tasks.filter(t => !ticked.has(t.id));
  for (const e of pend) {
    if (e.kind === "new" && (e.title || "").trim()) {
      tasks.push({id: "pending", domain: e.domain, title: e.title.trim(),
                  prio: e.prio || "normal", due: "-", link: "-", pending: true});
    }
  }
  render();
}

/* ---- the write ---- */

/* When a tick is evidence of a day, and when it is not.
 *
 * A tap measures the tap. Stamping every tick "observed" said the work happened
 * at the moment of the thumb, which is true when he ticks something as he
 * finishes it and false when he clears a backlog — and a tick three days late
 * was the most solid-looking row in the ledger and the least accurate date in
 * it. The grade described how well the timestamp was known, never what it was a
 * timestamp OF.
 *
 * So a plain tap still means now, observed, one gesture, unchanged. Holding the
 * tick asks which day, and that is written `inferred` at noon Tallinn: a date is
 * evidence of a day and no evidence of an hour. Noon so no offset change can
 * push it into the day either side.
 */
function tallinnNoon(day) {
  const [y, m, d] = day.split("-").map(Number);
  for (const guess of [9, 10]) {                 // summer +03, winter +02
    const t = Date.UTC(y, m - 1, d, guess, 0, 0);
    const hour = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Tallinn", hour: "2-digit", hour12: false
    }).format(new Date(t));
    if (Number(hour) === 12) return new Date(t).toISOString().replace(/\.\d+Z$/, "Z");
  }
  return new Date(Date.UTC(y, m - 1, d, 9, 0, 0)).toISOString().replace(/\.\d+Z$/, "Z");
}

function askWhen(task, li) {
  if (li.querySelector("input[type=date]")) return;
  const meta = li.querySelector(".meta");
  const keep = meta.innerHTML;
  meta.innerHTML = '<span>done on</span><input type="date"><button class="go">Save</button>' +
                   '<button class="link cancel">cancel</button>';
  const input = meta.querySelector("input");
  const day = todayTallinn();      // render()'s `today` is scoped to render()
  input.max = day;
  input.value = day;
  meta.querySelector(".cancel").addEventListener("click", () => { meta.innerHTML = keep; });
  meta.querySelector(".go").addEventListener("click", () => {
    if (!input.value) return;
    meta.innerHTML = keep;
    complete(task, li, input.value === day ? null : tallinnNoon(input.value));
  });
  input.focus();
}

async function complete(task, li, atTs) {
  li.classList.add("busy");
  const btn = li.querySelector("button.tick");
  btn.setAttribute("aria-pressed", "true");
  const ts = atTs || new Date().toISOString().replace(/\.\d+Z$/, "Z");

  // "observed" only for a tap meaning now — that timestamp measures the tap and
  // the tap is the completion. A day he picked is bounded evidence of a day.
  const ev = {ts, id: task.id, event: "done", actor: "kristjan",
              precision: atTs ? "inferred" : "observed", via: "app"};
  const name = "inbox/" + ts.replace(/[:.]/g, "-") + "-" + task.id + ".json";

  try {
    await put(name, JSON.stringify(ev) + "\n", "app: " + task.id + " done");
    li.classList.remove("busy");
    li.classList.add("sent");
    note("ok", task.id + (atTs ? " recorded as done on " + ts.slice(0, 10)
                                : " recorded at " + fmt(ts)));
    setTimeout(() => { tasks = tasks.filter(t => t.id !== task.id); render(); }, 900);
  } catch (err) {
    // Nothing is kept locally on failure. A tick that did not reach the
    // repository did not happen, and saying so is the whole point.
    li.classList.remove("busy");
    btn.setAttribute("aria-pressed", "false");
    note("err", err.message + " — not recorded. Try again.");
  }
}

/* ---- view ---- */

const fmt = ts => new Date(ts).toLocaleTimeString("en-GB",
  {timeZone: TZ, hour: "2-digit", minute: "2-digit"});

const todayTallinn = () => new Date().toLocaleDateString("en-CA", {timeZone: TZ});

function note(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.style.whiteSpace = "pre-line";
  el.textContent = text;
  const old = $(".msg"); if (old) old.remove();
  $("#main").prepend(el);
  if (kind === "ok") setTimeout(() => el.remove(), 4000);
}

function render() {
  const today = todayTallinn();
  const m = $("#main");
  m.innerHTML = "";
  if (!tasks.length) {
    m.innerHTML = '<div class="panel"><h2>Nothing open</h2><p>Every task in the index is closed.</p></div>';
  }
  for (const d of DOMAINS) {
    const rows = tasks.filter(t => t.domain === d);
    if (!rows.length) continue;
    const g = document.createElement("section");
    g.className = "group"; g.dataset.d = d;
    g.innerHTML = '<div class="ghead">' + LABEL[d] +
      '<span class="gcount">' + rows.length + "</span>" +
      '<button class="addbtn" type="button">+ add</button></div>';
    g.querySelector(".addbtn").addEventListener("click", () => startAdd(d, g));
    const ul = document.createElement("ul");
    for (const t of rows) {
      const li = document.createElement("li");
      li.dataset.prio = t.prio;
      const due = t.due && t.due !== "-"
        ? '<span class="due' + (t.due <= today ? " soon" : "") + '">' + t.due + "</span>" : "";
      if (t.pending) {
        li.className = "pending";
        li.innerHTML = '<span class="tid">pending</span><div class="body">' +
          '<div class="t"></div><div class="meta"><span>gets an id at the next sync</span></div></div>';
        li.querySelector(".t").textContent = t.title;
        ul.appendChild(li);
        continue;
      }
      li.innerHTML =
        '<button class="tick" aria-pressed="false" aria-label="Mark ' + t.id + ' done"></button>' +
        '<div class="body"><div class="t"></div>' +
        '<div class="meta"><span>' + t.id + "</span>" +
        (t.prio === "high" ? "<span>high</span>" : "") + due + "</div></div>";
      li.querySelector(".t").textContent = t.title;   // never innerHTML: titles are data
      const tick = li.querySelector("button");
      const free = () => !li.classList.contains("busy") && !li.classList.contains("sent");
      let held = null, wasHeld = false;
      const startHold = () => {
        wasHeld = false;
        held = setTimeout(() => { held = null; wasHeld = true; if (free()) askWhen(t, li); }, 500);
      };
      const endHold = () => { if (held) { clearTimeout(held); held = null; } };
      tick.addEventListener("pointerdown", startHold);
      tick.addEventListener("pointerup", endHold);
      tick.addEventListener("pointerleave", endHold);
      tick.addEventListener("pointercancel", endHold);
      tick.addEventListener("contextmenu", e => e.preventDefault());   // hold on iOS
      tick.addEventListener("click", () => {
        if (wasHeld) { wasHeld = false; return; }   // the hold already opened the picker
        if (free()) complete(t, li);
      });
      ul.appendChild(li);
    }
    g.appendChild(ul);
    m.appendChild(g);
  }
  $("#stamp").textContent = tasks.length + " open";
  $("#foot").textContent = "writes to " + REPO + " · build " + BUILD;
}

/* ---- adding a task ----------------------------------------------------
 * The app describes the task; it does NOT choose the id. Two devices adding a
 * task offline would both reach for the same number, and an id collision in an
 * append-only log is unrecoverable — two tasks would share one history. So the
 * file goes to inbox/ without an id and fold.py allocates one, in one place.
 *
 * That is why a new task shows as "pending" here until the next fold, rather
 * than appearing with a number the phone made up.
 */
function startAdd(domain, section) {
  if (section.querySelector("li.adding")) return;      // one at a time
  const ul = section.querySelector("ul") || section.appendChild(document.createElement("ul"));
  const li = document.createElement("li");
  li.className = "adding";
  li.innerHTML = '<input type="text" placeholder="What needs doing?" ' +
    'autocapitalize="sentences" autocomplete="off" enterkeyhint="done">' +
    '<button class="go" type="button">Add</button>';
  ul.prepend(li);

  const input = li.querySelector("input");
  const send = async () => {
    const title = input.value.trim();
    if (!title) { li.remove(); return; }
    li.querySelector(".go").disabled = true;
    input.disabled = true;
    const ts = new Date().toISOString().replace(/\.\d+Z$/, "Z");
    const req = {ts, kind: "new", domain, title, prio: "normal", due: "-"};
    try {
      await put("inbox/" + ts.replace(/[:.]/g, "-") + "-new.json",
                JSON.stringify(req) + "\n", "app: new task in " + domain);
      li.className = "pending";
      li.innerHTML = '<span class="tid">pending</span><div class="body">' +
        '<div class="t"></div><div class="meta"><span>gets an id at the next sync</span>' +
        "</div></div>";
      li.querySelector(".t").textContent = title;      // never innerHTML
      note("ok", "Added. It gets an id at the next sync.");
    } catch (err) {
      // Nothing is kept locally. A task that did not reach the repository was
      // not created, and the input stays so it can be retried rather than lost.
      input.disabled = false;
      li.querySelector(".go").disabled = false;
      note("err", err.message + " — not added. Try again.");
    }
  };

  li.querySelector(".go").addEventListener("click", send);
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); send(); } });
  input.focus();
}

function askForToken(msg) {
  $("#main").innerHTML =
    '<div class="panel"><h2>Connect</h2>' +
    "<p>A fine-grained token for <strong>" + REPO + "</strong> only, with " +
    "Contents: read and write. It stays on this device and is sent to GitHub alone.</p>" +
    '<input type="password" id="tok" placeholder="github_pat_…" autocomplete="off" ' +
    'autocapitalize="off" spellcheck="false">' +
    '<button class="primary" id="save">Connect</button></div>';
  if (msg) note("err", msg);
  $("#save").addEventListener("click", async () => {
    const v = $("#tok").value.trim();
    if (!v) return;
    token = v;
    try { await load(); localStorage.setItem(KEY, v); }
    catch (e) { token = null; askForToken(e.message); }
  });
}

/* ---- pull to refresh ----------------------------------------------------
 * Only engages at the very top of the page, so it never fights a normal scroll.
 * Deliberately not a library: the whole behaviour is three listeners, and a
 * dependency here would be more code to keep working than the feature itself.
 */
(function () {
  const THRESHOLD = 70;                 // far enough to be deliberate
  const MAX = 110;                      // where the rubber-band stops giving
  let startY = null, dist = 0, active = false;

  const bar = () => document.getElementById("pull");
  const label = () => document.getElementById("pulltext");

  function show(px, text) {
    bar().style.height = px + "px";
    label().textContent = text;
  }

  function reset() {
    startY = null; dist = 0; active = false;
    document.body.classList.remove("pulling");
    bar().style.transition = "height .18s ease";
    show(0, "");
    setTimeout(() => { bar().style.transition = ""; }, 200);
  }

  document.addEventListener("touchstart", e => {
    // scrollY must be 0 AND only one finger: a pinch is not a pull.
    if (window.scrollY > 0 || e.touches.length !== 1 || !token) return;
    startY = e.touches[0].clientY;
    dist = 0;
  }, {passive: true});

  document.addEventListener("touchmove", e => {
    if (startY === null) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0) { startY = null; show(0, ""); return; }   // scrolling up: let go
    active = true;
    document.body.classList.add("pulling");
    // Resistance, so it feels like pulling against something rather than dragging.
    const px = Math.min(MAX, dist * 0.5);
    show(px, dist > THRESHOLD ? "release to refresh" : "pull to refresh");
  }, {passive: true});

  document.addEventListener("touchend", async () => {
    if (!active) { reset(); return; }
    const go = dist > THRESHOLD;
    if (!go) { reset(); return; }
    show(46, "refreshing");
    try {
      await load();
    } catch (err) {
      note("err", err.message);
    }
    reset();
  });
})();

const quietly = () => token && load(true).catch(() => {});   // a silent refresh
                                                             // that fails stays
                                                             // silent: the list
                                                             // on screen is the
                                                             // last known truth
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - lastLoad > 20000) quietly();
});
window.addEventListener("focus", () => {
  if (Date.now() - lastLoad > 20000) quietly();
});
setInterval(() => { if (document.visibilityState === "visible") quietly(); }, 120000);

$("#reload").addEventListener("click", () => token && load().catch(e => note("err", e.message)));
$("#forget").addEventListener("click", () => {
  localStorage.removeItem(KEY); token = null; askForToken("Token removed from this device.");
});

try { token = localStorage.getItem(KEY); } catch (e) { token = null; }
if (token) load().catch(e => { token = null; askForToken(e.message); });
else askForToken();
</script>
</body>
</html>
